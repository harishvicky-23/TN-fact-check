analyze_query:
  description: |
    Analyze the user's query and break it down into specific, checkable sub-claims. Identify all entities, events, organizations, and dates involved. Classify the query as HISTORICAL (a settled past event, historical figure, or long-standing claim/myth -- e.g. a claim about WWII or a historical rumor) or CURRENT (recent/ongoing, needs up-to-date information). Determine the time window: for HISTORICAL claims use the relevant historical period; for CURRENT claims, if the user specified a date/period use exactly that, otherwise target as of {current_date}. Produce concrete search queries for each sub-claim: recency-biased terms for current claims (e.g. 'latest', 'today', the relevant year/month), or precise historical/reference terms for historical claims (e.g. exact names/dates, 'origin of', 'myth').

    The user's query is: {user_query}
    The user-specified time period (if any) is: {time_period}
    Today's date is: {current_date}
  expected_output: |
    A concise research brief listing: (1) the specific sub-claims to verify, (2) the exact entities/events/dates involved, (3) whether the query is HISTORICAL or CURRENT and the determined time window, and (4) 1-3 concrete search queries per sub-claim. No extra prose.

gather_evidence:
  description: |
    Using the research brief, search for evidence on every sub-claim. For CURRENT sub-claims, prioritize sources published within the determined time window using recency-biased search terms. For HISTORICAL sub-claims, prioritize encyclopedic, archival, academic, or established reference sources over blogs/forums, and specifically look for the origin and any documented debunking if the claim resembles a known myth. For every finding, record the source title, URL, publisher, and publish/last-updated date (or 'unknown' if undated). Gather 3-5 solid sources per sub-claim -- stop once you have enough to verify, do not over-search. Scrape a page only when the snippet doesn't confirm a date, figure, or quote.
  expected_output: |
    For each sub-claim: the finding in 1-2 sentences, plus a short list of sources (title, URL, publisher, date). Clearly mark whether each sub-claim was treated as HISTORICAL or CURRENT.

verify_facts:
  description: |
    Review all gathered evidence. For each sub-claim, verify it against at least one additional independent, credible source beyond what the researcher already found. Identify conflicting information, outdated claims (superseded by newer developments, for CURRENT sub-claims), or myths/misinformation (for HISTORICAL sub-claims). Check that each source is appropriate to the claim's era -- recent, dated sources for current claims; reputable historical/academic sources for historical ones. Assign each sub-claim a status: Verified, Partially Verified, Unverified, Outdated, or False, and rate each source's reliability (High/Medium/Low).
  expected_output: |
    For each sub-claim: a status (Verified/Partially Verified/Unverified/Outdated/False), a 1-3 sentence justification, and the sources used with a reliability rating each. Keep it tight -- no repeated explanations.

write_factcheck_report:
  description: |
    Using the verified findings, produce the final fact-check report as structured data for direct display in a frontend UI. Include: the original user query; whether the claim is historical or current and the time window used; an overall verdict (True / False / Misleading / Unverified / Needs More Context); a confidence level (High/Medium/Low); a 2-4 sentence executive summary; a per-sub-claim breakdown with status, a short explanation, and its sources; and a complete, deduplicated list of every source used across the whole investigation, each with title, URL, publisher, date, reliability, and whether it confirms/contradicts/partially confirms the claim. Only cite sources that were actually gathered earlier in the pipeline -- never invent a source or URL. Today's date is {current_date}.
  expected_output: |
    A FactCheckReport object with every field populated: user_query, is_historical, time_window_used, overall_verdict, confidence, executive_summary, sub_claims (each with sub_claim, status, explanation, sources), all_sources (deduplicated), and report_generated_on.
